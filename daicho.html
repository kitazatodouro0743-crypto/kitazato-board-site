<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>台帳登録</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --ink: #1d1d1b; --sub: #6b6a66; --line: #d9d6cf;
    --accent: #1f5fae; --accent-ink: #fff; --on: #e6eefa; --err: #b3261e; --ok: #1e7a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --card: #22221f; --ink: #eceae4; --sub: #a3a199; --line: #3a3934;
      --accent: #6aa3ef; --accent-ink: #0d1b2e; --on: #1c2a3e; --err: #f2867d; --ok: #6fcf8f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --card: #22221f; --ink: #eceae4; --sub: #a3a199; --line: #3a3934;
    --accent: #6aa3ef; --accent-ink: #0d1b2e; --on: #1c2a3e; --err: #f2867d; --ok: #6fcf8f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .q > label, .q > .lab { display: block; font-weight: 600; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { flex: 1 1 auto; min-height: 48px; padding: 8px 12px; font-size: 16px; border-radius: 10px;
                  border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .chips button[aria-pressed="true"] { background: var(--on); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  select, input[type=text], input[type=password], textarea { width: 100%; font-size: 17px; padding: 12px; border-radius: 10px;
         border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  textarea { min-height: 64px; }
  .sugg { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .sugg:empty { display: none; }
  .sugg button { min-height: 40px; padding: 6px 10px; font-size: 15px; border-radius: 8px;
                 border: 1px solid var(--line); background: var(--on); color: var(--ink); }
  .hint { color: var(--sub); font-size: 14px; margin-top: 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
         padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; }
  .btn { flex: 1; min-height: 52px; font-size: 18px; font-weight: 700; border-radius: 12px; border: 0;
         background: var(--accent); color: var(--accent-ink); }
  .btn.sub { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 600; }
  .btn:disabled { opacity: .5; }
  .err { color: var(--err); font-weight: 600; margin: 8px 0; }
  dl.conf { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin: 0 0 12px; }
  dl.conf div { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  dl.conf div:last-child { border-bottom: 0; }
  dl.conf dt { color: var(--sub); width: 5.5em; flex: none; }
  dl.conf dd { margin: 0; font-weight: 600; word-break: break-all; }
  .done { text-align: center; padding: 32px 8px; }
  .done .big { font-size: 22px; font-weight: 700; color: var(--ok); margin-bottom: 8px; }
  .done .big.wait { color: var(--ink); }
  .result { text-align: left; white-space: pre-wrap; word-break: break-all; background: var(--card);
            border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 12px; }
  .result:empty { display: none; }
  .paving { width: 100%; max-width: 320px; margin: 0 auto 16px; display: block; }
  .paving .base { fill: #b9b4a8; } .paving .asph { fill: #2b2b2b; }
  .paving .body { fill: #f2b705; } .paving .cab { fill: #f2b705; } .paving .win { fill: #cfe3f5; }
  .paving .drum { fill: #555; } .paving .hub { fill: #ddd; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <!-- 合言葉（初回だけ） -->
  <section id="vKey" hidden>
    <h1>台帳登録</h1>
    <div class="q">
      <label for="key">合言葉</label>
      <input id="key" type="password" autocomplete="off">
      <div class="hint">最初の1回だけです。このスマホに覚えさせます。</div>
    </div>
    <p id="keyErr" class="err" hidden></p>
  </section>

  <!-- 入力 -->
  <section id="vForm" hidden>
    <h1>台帳登録</h1>
    <div class="q"><span class="lab">会社</span><div class="chips" data-name="company">
      <button type="button">北里道路</button><button type="button">合原技建</button><button type="button">緒方工業</button>
    </div></div>
    <div class="q" id="whoQ" hidden><label for="whoSel">登録する人</label><select id="whoSel"></select></div>
    <div class="q"><span class="lab">区分</span><div class="chips" data-name="kubun">
      <button type="button">元請公共</button><button type="button">下請公共</button><button type="button">元請民間</button>
      <button type="button">下請民間</button><button type="button">その他</button>
    </div></div>
    <div class="q">
      <label for="hacchusha">発注者名</label>
      <input id="hacchusha" type="text" autocomplete="off" placeholder="例: 南小国町、大仁産業">
      <div class="sugg" id="hacchushaSugg"></div>
      <div class="hint" id="hacchushaHint">先に会社を選ぶと、台帳にある書き方が候補に出ます。</div>
    </div>
    <div class="q"><span class="lab">工種</span><div class="chips" data-name="koshu">
      <button type="button">舗装</button><button type="button">土木</button><button type="button">その他</button>
    </div></div>
    <div class="q">
      <label for="kojimei">工事名</label>
      <input id="kojimei" type="text" autocomplete="off">
    </div>
    <div class="q"><span class="lab">予定登録（見積依頼だけ）</span><div class="chips" data-name="yotei">
      <button type="button" data-v="1">はい</button><button type="button" data-v="0">いいえ（施工が決まっている）</button>
    </div></div>
    <div class="q">
      <label for="kingaku">初回工事金額・税込（任意）</label>
      <input id="kingaku" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 1500000">
      <div class="hint">台帳の「初回契約工事金額（込）」に入ります。分からなければ空のままで。</div>
    </div>
    <div class="q">
      <label for="memo">メモ（任意）</label>
      <textarea id="memo" placeholder="見積期限・場所など"></textarea>
    </div>
    <p id="formErr" class="err" hidden></p>
  </section>

  <!-- 確認 -->
  <section id="vConf" hidden>
    <h1>この内容で登録します</h1>
    <dl class="conf" id="confList"></dl>
    <p class="hint">送ると、あかさが台帳に登録して、この画面と LINE WORKS の「AIテスト」に仕訳番号を出します（30秒〜1分ほど）。</p>
    <p id="sendErr" class="err" hidden></p>
  </section>

  <!-- 待機中（あかさが登録している間） -->
  <section id="vWait" hidden>
    <div class="done">
      <svg class="paving" viewBox="0 0 320 120" aria-hidden="true">
        <rect x="0" y="86" width="320" height="18" rx="2" class="base"/>
        <rect x="0" y="86" width="0" height="18" class="asph"><animate attributeName="width" values="0;250;250;0" keyTimes="0;.45;.55;1" dur="4s" repeatCount="indefinite"/></rect>
        <g><animateTransform attributeName="transform" type="translate" values="0 0;230 0;230 0;0 0" keyTimes="0;.45;.55;1" dur="4s" repeatCount="indefinite"/>
          <rect x="22" y="38" width="44" height="26" rx="4" class="body"/>
          <rect x="30" y="20" width="26" height="20" rx="3" class="cab"/>
          <rect x="34" y="24" width="18" height="10" rx="2" class="win"/>
          <circle cx="72" cy="66" r="20" class="drum"/>
          <circle cx="72" cy="66" r="6" class="hub"/>
          <circle cx="24" cy="72" r="14" class="drum"/>
          <circle cx="24" cy="72" r="4" class="hub"/>
        </g>
      </svg>
      <div class="big wait">待機中…</div>
      <div>あかさが台帳に登録しています。<br><span id="waitSec">0</span>秒（30秒〜1分ほどかかります）</div>
    </div>
    <dl class="conf sent"></dl>
  </section>

  <!-- 完了 -->
  <section id="vDone" hidden>
    <div class="done">
      <div class="big" id="doneTitle">登録完了しました</div>
      <div id="doneBody" class="result"></div>
    </div>
    <p class="hint">送った内容</p>
    <dl class="conf sent"></dl>
  </section>
</main>

<div class="bar"><div class="in" id="bar"></div></div>

<script>
// 受信箱GAS（あかさの受付）。合言葉はここには書かない＝初回にスマホへ覚えさせる
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwk_MrojaVlJg-qCAATXn89gpz3BGrZCtXTg4YUuY3IcyAB_O-KvPPSL-S4ZVUNKK6T/exec";
const LS_KEY = "daichoFormKey", LS_LISTS = "daichoFormLists", LS_WHO = "daichoFormWho";

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const state = { company: "", who: "", kubun: "", koshu: "", yotei: "1" };

// 登録する人・発注者名の一覧は合言葉が合ったときに受信箱GASからもらう（公開のソースに名前を書かないため）
function lists() { try { return JSON.parse(store.get(LS_LISTS) || "{}"); } catch (e) { return {}; } }
function saveLists(r) { store.set(LS_LISTS, JSON.stringify({ staff: r.staff || {}, hacchusha: r.hacchusha || {} })); }
function renderCompany() { renderWho(); renderHacchusha(); }

// 発注者名は手入力。選んだ会社の台帳にある書き方を、欄の下にボタンで出す
// （datalist はスマホのブラウザによって候補が出ないので使わない）
function hacchushaNames() { return (lists().hacchusha || {})[state.company] || []; }
function renderHacchusha() {
  const names = hacchushaNames();
  $("hacchushaHint").textContent = !state.company ? "先に会社を選ぶと、台帳にある書き方が候補に出ます。"
    : names.length ? "台帳に " + names.length + " 件。押すとそのまま入ります。無ければ手で打ってください。"
    : "候補の一覧が届いていません（手で打てば登録できます）。";
  showSugg();
}
function showSugg() {
  const box = $("hacchushaSugg");
  box.innerHTML = "";
  if (document.activeElement !== $("hacchusha")) return;
  const key = (s) => s.normalize("NFKC").replace(/\s/g, "").toLowerCase();
  const q = key($("hacchusha").value);
  const names = hacchushaNames();
  if (q && names.some((n) => n === $("hacchusha").value.trim())) return;  // 候補どおり入っていれば閉じる
  for (const n of names.filter((n) => !q || key(n).includes(q)).slice(0, 8)) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    // 押した瞬間に欄からフォーカスが外れて候補が消えないよう、mousedown/touchstart で先に入れる
    b.addEventListener("pointerdown", (ev) => { ev.preventDefault(); $("hacchusha").value = n; box.innerHTML = ""; $("hacchusha").blur(); });
    box.appendChild(b);
  }
}
$("hacchusha").addEventListener("focus", showSugg);
$("hacchusha").addEventListener("input", showSugg);
$("hacchusha").addEventListener("blur", () => setTimeout(() => { $("hacchushaSugg").innerHTML = ""; }, 150));

// 登録する人はプルダウン。前回この会社で選んだ人を最初から選んでおく
function renderWho() {
  const names = (lists().staff || {})[state.company] || [];
  $("whoQ").hidden = !state.company;
  let last = {};
  try { last = JSON.parse(store.get(LS_WHO) || "{}"); } catch (e) {}
  if (!names.includes(state.who)) state.who = names.includes(last[state.company]) ? last[state.company] : "";
  const sel = $("whoSel");
  sel.innerHTML = "";
  for (const [v, t] of [["", "選んでください"], ...names.map((n) => [n, n])]) {
    const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o);
  }
  sel.value = state.who;
}
$("whoSel").addEventListener("change", () => { state.who = $("whoSel").value; });

function show(view) {
  for (const v of ["vKey", "vForm", "vConf", "vWait", "vDone"]) $(v).hidden = v !== view;
  const bar = $("bar");
  bar.innerHTML = "";
  const add = (label, fn, sub) => {
    const b = document.createElement("button");
    b.className = "btn" + (sub ? " sub" : ""); b.textContent = label; b.onclick = fn; bar.appendChild(b); return b;
  };
  if (view === "vKey") add("はじめる", checkKey);
  if (view === "vForm") add("確認へ", toConfirm);
  if (view === "vConf") { add("戻る", () => show("vForm"), true); add("登録する", send); }
  if (view === "vDone") add("続けて登録する", reset);
  window.scrollTo(0, 0);
}

async function post(body, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs || 30000);
  try {
    const res = await fetch(ENDPOINT, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body), signal: ctl.signal,
    });
    return await res.json();
  } finally { clearTimeout(t); }
}

async function checkKey() {
  const k = $("key").value.trim();
  const err = $("keyErr");
  err.hidden = true;
  if (!k) return;
  const btn = $("bar").firstChild; btn.disabled = true; btn.textContent = "確かめています…";
  try {
    const r = await post({ action: "daichoForm", key: k, check: true });
    if (r.ok) { store.set(LS_KEY, k); saveLists(r); renderCompany(); show("vForm"); return; }
    err.textContent = r.error || "合言葉が違います"; err.hidden = false;
  } catch (e) {
    err.textContent = "つながりませんでした。電波の良いところでもう一度"; err.hidden = false;
  }
  btn.disabled = false; btn.textContent = "はじめる";
}

// 選択ボタン
document.querySelectorAll(".chips").forEach((box) => {
  const name = box.dataset.name;
  const sync = () => box.querySelectorAll("button").forEach((b) =>
    b.setAttribute("aria-pressed", String((b.dataset.v || b.textContent) === state[name])));
  box.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    state[name] = b.dataset.v || b.textContent; sync();
    if (name === "company") renderCompany();
  });
  sync();
});

// 手で打った発注者名が、全角半角の違いだけで台帳にある名前と同じなら、台帳の書き方に直す（ＪＡ阿蘇／JA阿蘇）
function hacchushaValue() {
  const typed = $("hacchusha").value.trim();
  const names = (lists().hacchusha || {})[state.company] || [];
  if (!typed || names.includes(typed)) return { name: typed, note: "" };
  const key = (s) => s.normalize("NFKC").replace(/\s/g, "");
  const hit = names.find((n) => key(n) === key(typed));
  if (hit) return { name: hit, note: "（台帳の書き方に合わせました）" };
  return { name: typed, note: names.length ? "（台帳に無い発注者）" : "" };
}

function formData() {
  return {
    company: state.company, who: state.who, kubun: state.kubun, koshu: state.koshu, yotei: state.yotei === "1",
    hacchusha: hacchushaValue().name, kojimei: $("kojimei").value.trim(), memo: $("memo").value.trim(),
    kingaku: $("kingaku").value.normalize("NFKC").replace(/[^0-9]/g, ""),
  };
}

function toConfirm() {
  const d = formData();
  const miss = [];
  if (!d.company) miss.push("会社");
  else if (!d.who) miss.push("登録する人");
  if (!d.kubun) miss.push("区分");
  if (!d.hacchusha) miss.push("発注者名");
  if (!d.koshu) miss.push("工種");
  if (!d.kojimei) miss.push("工事名");
  const err = $("formErr");
  if (miss.length) { err.textContent = "まだ入っていません: " + miss.join("・"); err.hidden = false; return; }
  err.hidden = true;
  const hv = hacchushaValue();
  const rows = [["会社", d.company], ["登録する人", d.who], ["区分", d.kubun],
    ["発注者名", d.hacchusha + hv.note], ["工種", d.koshu],
    ["工事名", d.kojimei], ["予定登録", d.yotei ? "はい（見積依頼だけ）" : "いいえ（施工が決まっている）"]];
  if (d.kingaku) rows.push(["初回金額", Number(d.kingaku).toLocaleString("ja-JP") + " 円（税込）"]);
  if (d.memo) rows.push(["メモ", d.memo]);
  $("confList").innerHTML = "";
  for (const [k, v] of rows) {
    const div = document.createElement("div");
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    div.append(dt, dd); $("confList").appendChild(div);
  }
  $("sendErr").hidden = true;
  show("vConf");
}

async function send() {
  const btns = $("bar").querySelectorAll("button");
  btns.forEach((b) => (b.disabled = true));
  btns[1].textContent = "送っています…";
  const d = formData();
  const err = $("sendErr");
  try {
    const r = await post({ action: "daichoForm", key: store.get(LS_KEY), data: d });
    if (r.ok) {
      let last = {}; try { last = JSON.parse(store.get(LS_WHO) || "{}"); } catch (e) {}
      last[d.company] = d.who; store.set(LS_WHO, JSON.stringify(last));
      waitResult(r.row); return;
    }
    if (r.error === "合言葉が違います") { store.del(LS_KEY); show("vKey"); return; }
    err.textContent = r.error || "登録できませんでした";
  } catch (e) {
    err.textContent = "つながりませんでした。届いたか分からないので、二重にならないよう LINE WORKS を見てから送り直してください";
  }
  err.hidden = false;
  btns.forEach((b) => (b.disabled = false));
  btns[1].textContent = "登録する";
}

// あかさの登録が終わるまで受信箱に聞きに行く。番人がフォームの行にだけ返事を残している
async function waitResult(row) {
  // 確認画面で見せた内容を、待機中と完了の画面にも写す
  document.querySelectorAll("dl.sent").forEach((dl) => { dl.innerHTML = $("confList").innerHTML; });
  show("vWait");
  const start = Date.now();
  const tick = setInterval(() => { $("waitSec").textContent = Math.floor((Date.now() - start) / 1000); }, 1000);
  const finish = (title, body) => { clearInterval(tick); $("doneTitle").textContent = title; $("doneBody").textContent = body; show("vDone"); };
  while (row && Date.now() - start < 180000) {
    await new Promise((res) => setTimeout(res, 4000));
    try {
      const r = await post({ action: "daichoForm", key: store.get(LS_KEY), status: row }, 15000);
      if (r.ok && r.state === "DONE") {
        if (r.note === "error" || /^error/.test(r.note)) return finish("登録できませんでした", "LINE WORKS の「AIテスト」で理由を確かめてください。");
        return finish("登録完了しました", r.note && r.note !== "ok" ? r.note : "仕訳番号は LINE WORKS の「AIテスト」に届いています。");
      }
    } catch (e) { /* 電波が切れても聞き直す */ }
  }
  finish("受け付けました", "時間がかかっています。終わったら LINE WORKS の「AIテスト」に仕訳番号が届きます。");
}

function reset() {
  Object.assign(state, { company: state.company, kubun: "", koshu: "", yotei: "1" });
  for (const id of ["hacchusha", "kojimei", "kingaku", "memo"]) $(id).value = "";
  renderCompany();
  document.querySelectorAll(".chips").forEach((box) => box.querySelectorAll("button").forEach((b) =>
    b.setAttribute("aria-pressed", String((b.dataset.v || b.textContent) === state[box.dataset.name]))));
  show("vForm");
}

if (store.get(LS_KEY)) {
  renderCompany();
  show("vForm");
  // 一覧を取り直す（人・発注者が増えたとき・合言葉が変わったとき用）。電波が無ければ手元の一覧のまま
  post({ action: "daichoForm", key: store.get(LS_KEY), check: true }, 15000).then((r) => {
    if (r.ok) { saveLists(r); renderCompany(); }
    else if (r.error === "合言葉が違います") { store.del(LS_KEY); show("vKey"); }
  }).catch(() => {});
} else {
  show("vKey");
}
</script>
</body>
</html>
